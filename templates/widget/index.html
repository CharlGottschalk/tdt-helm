<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Theme tokens and .hud-label/.mono/.display are injected by Helm before this style. */
  .state { color: var(--c-text-2); font-size: var(--fs-sm); }
  .row { display: flex; justify-content: space-between; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line); }
  .row b { font-family: var(--font-display); color: var(--c-text-0); }
  button { font: inherit; color: var(--c-on-accent); background: var(--c-cyan); border: 0; border-radius: var(--radius-sm); padding: 4px 12px; cursor: pointer; }
</style>
</head>
<body>
  <div id="app" class="state">Loading…</div>
  <script>
    // `helm` is injected by the Helm bridge (contracts/widget.md#bridge).
    const app = document.getElementById('app')
    let settings = {}

    function show(message, action) {
      app.className = 'state'
      app.textContent = message
      if (action) {
        const b = document.createElement('button')
        b.textContent = action.label
        b.onclick = action.run
        app.append(' ', b)
      }
    }

    async function load() {
      show('Loading…')
      const result = await helm.call('tdt', 'tdt_workspace_status', {})
      if (!result.ok) return show(result.error.message, { label: 'Retry', run: load })
      const d = result.data
      app.className = ''
      app.replaceChildren(
        ...[['Pending reviews', d.pending_candidates], ['Due reminders', d.due_reminders], ['Projects', d.projects_total]]
          .slice(0, settings.limit ?? 10)
          .map(([label, value]) => {
            const row = document.createElement('div')
            row.className = 'row'
            const l = document.createElement('span'); l.textContent = label
            const v = document.createElement('b'); v.textContent = value ?? '—'
            row.append(l, v)
            return row
          }),
      )
    }

    helm.on('settings', (s) => { settings = s; load() })
    helm.on('refresh', load)
    helm.ready()
  </script>
</body>
</html>
