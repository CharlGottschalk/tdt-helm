<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Theme tokens and .hud-label/.mono/.display are injected by Helm before this style. */
  .state { color: var(--c-text-2); font-size: var(--fs-sm); }
  .row { display: flex; align-items: baseline; justify-content: space-between; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line); }
  .row b { font-family: var(--font-display); font-size: var(--fs-xl); color: var(--c-text-0); }
  .row b.attention { color: var(--c-amber); }
  button { font: inherit; font-size: var(--fs-sm); color: var(--c-on-accent); background: var(--c-cyan); border: 0; border-radius: var(--radius-sm); padding: 2px 10px; cursor: pointer; }
</style>
</head>
<body>
  <div id="app" class="state">Loading…</div>
  <script>
    // A stack-shipped example: one read-only TDT call through the helm bridge.
    const app = document.getElementById('app')

    function show(message, retry) {
      app.className = 'state'
      app.textContent = message
      if (retry) {
        const b = document.createElement('button')
        b.textContent = 'Retry'
        b.onclick = load
        app.append(' ', b)
      }
    }

    function row(label, value, attention) {
      const r = document.createElement('div')
      r.className = 'row'
      const l = document.createElement('span')
      l.className = 'hud-label'
      l.textContent = label
      const v = document.createElement('b')
      v.textContent = value
      if (attention) v.className = 'attention'
      r.append(l, v)
      return r
    }

    async function load() {
      const result = await helm.call('tdt', 'tdt_workspace_status', {})
      if (!result.ok) return show(result.error.message, result.error.retry !== 'inspect_outcome')
      const d = result.data
      app.className = ''
      app.replaceChildren(
        row('Pending reviews', d.pending_candidates, d.pending_candidates > 0),
        row('Due reminders', d.due_reminders, d.due_reminders > 0),
        row('Projects available', `${d.projects_available}/${d.projects_total}`, d.projects_missing > 0),
      )
    }

    helm.on('settings', load)
    helm.on('refresh', load)
    helm.ready()
  </script>
</body>
</html>
